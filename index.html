<style>
  /* Layout: lean top bar (brand · search · filters) → full-height map beside a work panel with two tabs (רחובות / מגמות).
     Palette: cool stone neutrals, one teal UI accent; the ₪/m² data ramp (sand → wine) is separate from the accent. */
  :root {
    --bg:#f1f2f4; --surface:#ffffff; --surface-2:#f7f8f9; --ink:#171a1f; --muted:#646b75; --line:#dfe2e6; --line-2:#eceef1;
    --accent:#0f6b73; --accent-soft:#e2f0f1; --accent-ink:#0a4f55;
    --good:#1e7a46; --bad:#b4372a; --grey-mark:#b9bdc3; --tile-filter:none;
    --font: Heebo, "Segoe UI", Arial, sans-serif;
    --r: 10px; --shadow: 0 6px 24px rgb(23 26 31 / 12%);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#15181d; --surface:#1d2127; --surface-2:#23282f; --ink:#e9ebee; --muted:#9aa2ad; --line:#333a44; --line-2:#2a3038;
    --accent:#4fb3bb; --accent-soft:#173a3e; --accent-ink:#8ad3d9; --good:#5cc088; --bad:#e2695b; --grey-mark:#5b626c;
    --tile-filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); --shadow: 0 6px 24px rgb(0 0 0 / 45%); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg:#15181d; --surface:#1d2127; --surface-2:#23282f; --ink:#e9ebee; --muted:#9aa2ad; --line:#333a44; --line-2:#2a3038;
    --accent:#4fb3bb; --accent-soft:#173a3e; --accent-ink:#8ad3d9; --good:#5cc088; --bad:#e2695b; --grey-mark:#5b626c;
    --tile-filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); --shadow: 0 6px 24px rgb(0 0 0 / 45%); color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; unicode-bidi: isolate; }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .muted { color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); vertical-align: middle; }
  .tag.grey { background: var(--line-2); color: var(--muted); }
  .trend { font-weight: 600; font-size: 12px; }
  .trend.up { color: var(--good); } .trend.down { color: var(--bad); } .trend.flat { color: var(--muted); }
  .delta { font-weight: 600; font-size: 12px; }
  .delta.up { color: var(--bad); } .delta.down { color: var(--good); } .delta.flat { color: var(--muted); }

  /* ---------- top bar ---------- */
  .bar { flex: none; position: relative; z-index: 1200; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 8px; flex: none; }
  .brand b { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; color: var(--accent); }
  .brand span { color: var(--muted); font-size: 13px; }
  .search { position: relative; flex: 1; max-width: 560px; min-width: 0; }
  .search input { width: 100%; height: 40px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 0 40px 0 12px; outline: none; }
  .search input:focus { border-color: var(--accent); background: var(--surface); }
  .search svg { position: absolute; top: 12px; right: 12px; width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; pointer-events: none; }
  .sugg { position: absolute; top: 44px; right: 0; left: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; display: none; }
  .sugg.open { display: block; }
  .sugg button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: right; background: transparent; border: 0; border-bottom: 1px solid var(--line-2); padding: 9px 12px; }
  .sugg button:last-child { border-bottom: 0; }
  .sugg button.sel, .sugg button:hover { background: var(--accent-soft); }
  .sugg .grow { flex: 1; min-width: 0; }
  .sugg .grow b { display: block; font-weight: 600; }
  .sugg .grow small { color: var(--muted); font-size: 12px; }
  .sugg .v { flex: none; text-align: left; font-weight: 600; }
  .fbtn { flex: none; height: 40px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 0 12px; font-weight: 500; }
  .fbtn.on, .fbtn:hover { border-color: var(--accent); }
  .fbtn .badge { min-width: 20px; height: 20px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
  .fbtn .badge:empty { display: none; }
  .seg { display: none; margin-inline-start: auto; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: var(--surface-2); padding: 6px 12px; font-size: 13px; }
  .seg button.on { background: var(--accent); color: #fff; }

  /* ---------- active filters strip ---------- */
  .active { flex: none; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; }
  .active[hidden] { display: none; }
  .achip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; border: 0; }
  .achip i { font-style: normal; font-size: 14px; line-height: 1; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }
  .achip:hover i { background: rgb(0 0 0 / 10%); }
  .clearall { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 0 6px; }

  /* ---------- filter popover ---------- */
  .fpop { position: absolute; top: 100%; right: 16px; left: 16px; max-width: 760px; margin-inline-start: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px 10px; display: none; z-index: 1300; }
  .fpop.open { display: block; }
  .fgroup { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
  .fgroup:last-of-type { border-bottom: 0; }
  .fgroup > span { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 30px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 11px; font-size: 13px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.soft.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
  .ffoot { display: flex; align-items: center; gap: 12px; padding-top: 10px; color: var(--muted); font-size: 13px; }
  .ffoot .primary { margin-inline-start: auto; height: 34px; border: 0; border-radius: var(--r); background: var(--accent); color: #fff; font-weight: 600; padding: 0 16px; }

  /* ---------- main ---------- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 440px; }
  main.wide { grid-template-columns: 1fr 580px; }
  #map { height: 100%; background: var(--bg); position: relative; z-index: 1; }
  .leaflet-tile-pane { filter: var(--tile-filter); }
  #maperr { position: absolute; inset: auto 0 0 0; z-index: 500; background: var(--surface); color: var(--muted); font-size: 12px; padding: 6px 12px; display: none; border-top: 1px solid var(--line); }
  .panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); border-inline-start: 1px solid var(--line); }
  .tabs { flex: none; display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; }
  .tabs button { flex: 1; height: 44px; border: 0; background: transparent; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .content { flex: 1; overflow: auto; min-height: 0; min-width: 0; }

  /* overview / street card */
  .card { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .card .back { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 0; font-size: 13px; }
  .card h2 { margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; text-wrap: balance; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px 14px; margin-top: 12px; }
  .kpi small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .kpi b { font-size: 18px; font-weight: 700; display: block; line-height: 1.25; }
  .kpi .trend { margin-inline-start: 4px; }
  .spark { margin-top: 12px; direction: ltr; }
  .spark svg { display: block; width: 100%; height: auto; overflow: visible; }
  .spark .ax { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 13px; }
  .facts small { display: block; color: var(--muted); font-size: 11px; }
  .facts b { font-weight: 600; }
  .pin { border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 6px; flex: none; }
  .pin.on { color: var(--accent); }
  .pin:hover { background: var(--accent-soft); color: var(--accent-ink); }

  /* list */
  .tools { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .tools { flex-wrap: wrap; }
  .tools select { height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 0 6px; font-size: 13px; max-width: 46%; min-width: 0; }
  .tools .n { margin-inline-start: auto; }
  .row { width: 100%; display: flex; align-items: center; gap: 10px; text-align: right; background: transparent; border: 0; border-bottom: 1px solid var(--line-2); padding: 9px 12px 9px 8px; }
  .row:hover, .row.hot { background: var(--surface-2); }
  .row .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px rgb(0 0 0 / 15%); }
  .row .dot.approx { border: 2px dashed var(--muted); background: transparent !important; box-shadow: none; }
  .row .dot.none { border: 1px solid var(--line); background: transparent !important; box-shadow: none; }
  .row .grow { flex: 1; min-width: 0; }
  .row .grow strong { display: block; font-weight: 600; font-size: 14px; }
  .row .grow small { color: var(--muted); font-size: 12px; }
  .row .v { flex: none; text-align: left; }
  .row .v b { display: block; font-weight: 700; font-size: 14px; }
  .row .v small { display: block; font-size: 11px; color: var(--muted); }
  .row .v .mom { margin-top: 3px; }
  .bar2 { height: 3px; border-radius: 2px; background: var(--line-2); margin-top: 4px; overflow: hidden; }
  .bar2 i { display: block; height: 100%; background: var(--accent); }
  .sectionhead { padding: 10px 16px 6px; font-size: 12px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line-2); line-height: 1.4; }
  .empty { color: var(--muted); padding: 20px 16px; font-size: 14px; line-height: 1.5; }

  /* deals */
  .dsort { display: flex; gap: 4px; align-items: center; padding: 8px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line-2); position: sticky; top: 0; z-index: 3; background: var(--surface); }
  .dsort button { border: 0; background: transparent; color: var(--muted); padding: 3px 8px; border-radius: 6px; font-size: 12px; }
  .dsort button.on { background: var(--ink); color: var(--bg); }
  .dsort .n { margin-inline-start: auto; }
  .deal { width: 100%; text-align: right; background: transparent; border: 0; border-bottom: 1px solid var(--line-2); padding: 9px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .deal:hover { background: var(--surface-2); }
  .deal .price { font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .deal .ppm { text-align: left; font-size: 13px; }
  .deal .ppm b { font-weight: 600; }
  .deal .where { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .more { width: 100%; height: 44px; border: 0; background: transparent; color: var(--accent); font-weight: 600; }

  /* trends */
  .tsec { padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
  .tsec .lbl { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .tchart { padding: 10px 16px 0; direction: ltr; }
  .tchart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tchart text { font-family: var(--font); font-size: 11px; fill: var(--muted); }
  .tlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 16px 0; font-size: 12px; }
  .tlegend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-inline-end: 6px; vertical-align: -1px; }
  .twrap { overflow-x: auto; padding: 8px 16px 16px; }
  table.tt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tt th, .tt td { padding: 7px 6px; border-bottom: 1px solid var(--line-2); text-align: right; white-space: nowrap; }
  .tt th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .tt td.num, .tt th.num { text-align: left; }
  .tt .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 6px; vertical-align: -1px; }
  .tnote { color: var(--muted); font-size: 12px; padding: 0 16px 16px; line-height: 1.5; }

  /* ask / answer */
  .sugg button.ask { background: var(--accent-soft); }
  .sugg button.ask.sel, .sugg button.ask:hover { background: var(--accent); color: #fff; }
  .sugg button.ask.sel .muted, .sugg button.ask:hover .muted, .sugg button.ask.sel small, .sugg button.ask:hover small { color: rgb(255 255 255 / 80%); }
  .sugg .u { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; margin-inline-end: 4px; opacity: .85; }
  .answer { margin: 12px 16px 0; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); border: 1px solid transparent; }
  .answer .qline { font-size: 12px; color: var(--accent-ink); display: flex; gap: 8px; align-items: center; }
  .answer .qline button { margin-inline-start: auto; border: 0; background: transparent; color: var(--accent-ink); font-weight: 600; font-size: 12px; }
  .answer p { margin: 6px 0 0; font-size: 14px; line-height: 1.55; }
  .answer .u { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface); color: var(--accent-ink); margin: 6px 4px 0 0; }
  .answer .miss { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .examples button { border: 1px dashed var(--line); background: transparent; color: var(--accent-ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .examples button:hover { background: var(--accent-soft); }

  /* local LLM */
  .llmbtn { flex: none; height: 40px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 0 12px; font-weight: 500; }
  .llmbtn .st { width: 9px; height: 9px; border-radius: 50%; background: var(--grey-mark); }
  .llmbtn .st.loading { background: #d99a1e; animation: pulse 1s infinite alternate; } .llmbtn .st.ready { background: var(--good); } .llmbtn .st.error { background: var(--bad); }
  @keyframes pulse { from { opacity: .4 } to { opacity: 1 } }
  .llmpop { position: absolute; top: 100%; right: 16px; left: 16px; max-width: 560px; margin-inline-start: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; display: none; z-index: 1300; font-size: 13px; line-height: 1.55; }
  .llmpop.open { display: block; }
  .llmpop h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
  .llmpop p { margin: 4px 0; }
  .llmpop select { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 0 8px; margin: 8px 0; }
  .llmpop .actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .llmpop .primary { height: 34px; border: 0; border-radius: var(--r); background: var(--accent); color: #fff; font-weight: 600; padding: 0 16px; }
  .llmpop .ghost { height: 34px; border: 1px solid var(--line); border-radius: var(--r); background: transparent; padding: 0 12px; }
  .prog { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; margin-top: 10px; }
  .prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .llmpop .status { color: var(--muted); font-size: 12px; margin-top: 6px; min-height: 1.2em; }
  .llmpop .warn { color: var(--bad); }
  .llmpop .okk { color: var(--good); }
  .llmtext { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .llmtext.thinking { color: var(--muted); }
  .llmtext .cur::after { content: "▍"; animation: pulse .8s infinite alternate; }
  .llmnote { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .followup { display: flex; gap: 6px; margin-top: 10px; }
  .followup input { flex: 1; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 10px; }
  .followup button { height: 34px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; padding: 0 12px; }

  /* overlay drawer */
  .overlay { position: fixed; inset: 0; background: rgb(23 26 31 / 45%); display: flex; justify-content: flex-start; z-index: 3000; }
  .drawer { background: var(--surface); width: min(440px, 100%); height: 100%; padding: 18px; overflow: auto; box-shadow: var(--shadow); }
  .drawer h2 { font-size: 30px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .drawer .x { float: left; border: 0; background: transparent; font-size: 22px; line-height: 1; }
  .cmp { margin-top: 14px; display: grid; gap: 8px; }
  .cmp div { display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin-top: 16px; }
  .grid b { display: block; font-weight: 600; }
  .grid small { color: var(--muted); }
  .drawer a { color: var(--accent); }

  /* leaflet bits */
  .leaflet-container { font-family: var(--font); background: var(--bg); }
  .leaflet-tooltip { direction: rtl; font-family: var(--font); background: var(--surface); color: var(--ink); border-color: var(--line); }
  .leaflet-tooltip-top:before { border-top-color: var(--line); }
  .leaflet-bar a { background: var(--surface); color: var(--ink); border-bottom-color: var(--line); }
  .legend { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); font-size: 12px; direction: rtl; text-align: right; box-shadow: var(--shadow); }
  .legend .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; font-weight: 600; cursor: pointer; }
  .legend .head span:last-child { color: var(--muted); font-weight: 400; }
  .legend .body { padding: 0 10px 8px; line-height: 1.6; }
  .legend.closed .body { display: none; }
  .legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-inline-end: 6px; border: 1px solid rgb(0 0 0 / 15%); }
  .legend .sw.approx { border: 2px dashed var(--muted); background: transparent; }
  .legend .cm { display: flex; gap: 4px; margin: 2px 0 6px; }
  .legend .cm button { flex: 1; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 3px 0; font-size: 12px; }
  .legend .cm button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .leaflet-control-attribution { background: rgb(255 255 255 / 70%); }


  /* v20: horizon changes, hedonic, forecast, comparison */
  .hzc { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .hzhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .hzhead .chips { gap: 4px; } .hzhead .chip { height: 26px; padding: 0 9px; font-size: 12px; }
  .hzb { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--line-2); color: var(--muted); }
  .hzb.up { background: #fde2d9; color: #a13420; } .hzb.down { background: #dbe9f5; color: #1f588a; }
  .hzsum button small { font-size: 10.5px; }
  .cmpc { padding-top: 10px; } .cmpt th { white-space: normal; } .cmpt tbody th { white-space: nowrap; } .cmpt tbody th { text-align: right; color: var(--muted); font-weight: 600; font-size: 11.5px; padding: 6px 4px; }
  .cmpt .cmpopen { border: 0; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 3px 9px; font-weight: 600; font-size: 12px; white-space: nowrap; }
  [dir="ltr"] .cmpt tbody th { text-align: left; }
  /* v19: language + LTR */
  .langbtn { flex: none; height: 40px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 0 10px; font-weight: 600; font-size: 12px; letter-spacing: .04em; }
  .langbtn:hover { border-color: var(--accent); }
  [dir="ltr"] .search input { padding: 0 12px 0 40px; } [dir="ltr"] .search svg { right: auto; left: 12px; }
  [dir="ltr"] .sugg button, [dir="ltr"] .row, [dir="ltr"] .deal, [dir="ltr"] .proj, [dir="ltr"] .expmenu button, [dir="ltr"] .tt th, [dir="ltr"] .tt td, [dir="ltr"] .legend { text-align: left; }
  [dir="ltr"] .tt td.num, [dir="ltr"] .tt th.num, [dir="ltr"] .row .v, [dir="ltr"] .proj .v, [dir="ltr"] .sugg .v, [dir="ltr"] .deal .ppm, [dir="ltr"] .val td.num, [dir="ltr"] .unit td.num, [dir="ltr"] .rin { text-align: right; }
  [dir="ltr"] .legend, [dir="ltr"] .leaflet-tooltip, [dir="ltr"] .areactl { direction: ltr; }
  [dir="ltr"] .drawer .x { float: right; } [dir="ltr"] .expmenu { left: auto; right: 16px; }
  [dir="ltr"] .deal .price { direction: ltr; } [dir="ltr"] b, [dir="ltr"] strong, [dir="ltr"] .row .grow small, [dir="ltr"] .proj small, [dir="ltr"] .leaflet-tooltip b { unicode-bidi: isolate; } [dir="ltr"] .fpop, [dir="ltr"] .llmpop { margin-inline-start: 0; margin-inline-end: auto; }
  /* v19: area, export, tax, rent, profile */
  .areactl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); display: flex; gap: 2px; padding: 3px; direction: rtl; }
  .areactl button { border: 0; background: transparent; border-radius: 7px; padding: 5px 9px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .areactl button:hover { background: var(--accent-soft); } .areactl button.on { background: var(--accent); color: #fff; }
  .expbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; height: 30px; min-width: 34px; padding: 0 8px; font-size: 13px; }
  .expbtn .lbl { font-size: 12.5px; } @media (max-width: 900px) { .expbtn .lbl { display: none; } }
  .expbtn:hover { border-color: var(--accent); }

<script>
"use strict";
/* =====================================================================
   0. STATIC (embedded at build time): settlement list + centroids
   ===================================================================== */
const STATIC = JSON.parse(document.getElementById("static").textContent);
const normName = (s) => String(s || "").replace(/[`'"״׳*]/g, "").replace(/\)\s*([^()]*?)\s*\(/g, "($1)").replace(/\s*-\s*/g, "-").replace(/\s+/g, " ").trim();
const CENTROID = {}; STATIC.centroids.forEach(([n, x, y]) => { CENTROID[normName(n)] = [y, x]; });
const SETTLEMENTS = STATIC.settlements.map(([name, code, deals, last]) => ({ name, code, deals, last, c: CENTROID[normName(name)] || null })).filter((s) => s.deals >= 20);
const SETTLEMENT_BY_NAME = new Map(SETTLEMENTS.map((s) => [s.name, s]));

/* =====================================================================
   0b. PRICES: CPI (CBS, chained, 2024 avg = 100) and average monthly wage (CBS, annual, ₪ current prices)
   ===================================================================== */
const CPI = { rows: STATIC.cpi.slice(), map: new Map(), latest: null, label: "" };
function cpiRebuild() { CPI.map = new Map(CPI.rows.map(([y, m, v]) => [y * 100 + m, v])); const l = CPI.rows[CPI.rows.length - 1]; CPI.latest = l[2]; CPI.label = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"][l[1] - 1] + " " + l[0]; }
cpiRebuild();
function cpiAt(iso) { const y = +iso.slice(0, 4), m = +iso.slice(5, 7); let v = CPI.map.get(y * 100 + m); if (v) return v; for (let k = 1; k <= 24; k++) { v = CPI.map.get(y * 100 + m - k) || CPI.map.get((y - Math.ceil(k / 12)) * 100 + ((m - k + 1200) % 12 || 12)); if (v) return v; } return CPI.rows[0][2]; }
const deflator = (iso) => CPI.latest / cpiAt(iso);      // multiply a nominal price to express it in today's shekels
const WAGE = STATIC.wage;                                 // year → average monthly wage (CBS; 2025–26 estimates)
const wageAt = (y) => WAGE[String(y)] || WAGE[String(Math.max(...Object.keys(WAGE).map(Number)))];
async function cpiRefresh() {
  // CBS index API returns monthly % changes; chain them onto our last known month
  try {
    const last = CPI.rows[CPI.rows.length - 1];
    const from = (last[1] < 10 ? "0" + last[1] : last[1]) + "-" + last[0];
    const r = await fetch("https://api.cbs.gov.il/index/data/price?id=120010&format=json&download=false&startPeriod=" + from + "&endPeriod=12-" + (CUR_YEAR + 1) + "&last=100").then((x) => x.json());
    const dates = (r.month && r.month[0] && r.month[0].date || []).map((d) => ({ y: d.year, m: d.month, pct: d.percent })).sort((a, b) => a.y - b.y || a.m - b.m);
    let v = last[2], added = 0;
    dates.forEach((d) => { if (d.y * 100 + d.m <= last[0] * 100 + last[1]) return; v = v * (1 + d.pct / 100); CPI.rows.push([d.y, d.m, +v.toFixed(2)]); added++; });
    if (added) { cpiRebuild(); await KV.set("cpi:v1", CPI.rows); }
    return added;
  } catch (e) { return 0; }
}

/* =====================================================================
   1. OVER CLIENT (public read-only SQL over the tax-authority register)
   ===================================================================== */
const OVER = {
  base: "https://www.over.org.il", ds: "fd06f5ae-8a4f-4120-b275-8a514ad23499", table: "append_taxes_nadlan_full_f41fb496_fd06f5ae",
  parcels: "append_shape_ff3176b1", gaz: "odata.gaztir_41720377", addr: "odata.ac1ae1fa_6d43_4685_8434_9953e950ca9b_19c5be7f",
  minuteWindow: [], maxPerMinute: 18, inflight: 0, maxInflight: 2, stats: null
};
const RES_NATURES = ["דירה בבית קומות", "דירת גן", "דירת גג", "קוטג' דו משפחתי", "קוטג' חד משפחתי", "קוטג' טורי", "בית בודד", "דירת נופש"];
const APT_KINDS = new Set([0, 1, 2]);
const KIND_LABEL = RES_NATURES;
const lit = (s) => "'" + String(s).replace(/'/g, "''") + "'";
const NUM = (c) => `CASE WHEN ${c} ~ '^[0-9]+(\\.[0-9]+)?$' THEN ${c}::numeric END`;
const RES_IN = RES_NATURES.map(lit).join(",");
const NAT_CASE = "CASE deal_nature " + RES_NATURES.map((x, i) => `WHEN ${lit(x)} THEN ${i}`).join(" ") + " END";
const APT_IN = RES_NATURES.slice(0, 3).map(lit).join(",");
const SANE = `asset_area ~ '^[0-9]+(\\.[0-9]+)?$' AND deal_amount ~ '^[0-9]+(\\.[0-9]+)?$' AND asset_area::numeric >= 20 AND portion ~ '^[0-9.]+$' AND portion::numeric >= 0.98 AND deal_amount::numeric/asset_area::numeric BETWEEN 1000 AND 120000`;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function overSql(sql, tries) {
  tries = tries || 0;
  // client-side pacing: OVER allows ~20 queries/minute
  while (true) {
    const now = Date.now(); OVER.minuteWindow = OVER.minuteWindow.filter((t) => now - t < 60000);
    if (OVER.minuteWindow.length < OVER.maxPerMinute && OVER.inflight < OVER.maxInflight) break;
    await sleep(400);
  }
  OVER.minuteWindow.push(Date.now()); OVER.inflight++;
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 60000);
    let res;
    try { res = await fetch(OVER.base + "/api/append/" + OVER.ds + "/sql", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql }), signal: ctrl.signal }); }
    finally { clearTimeout(to); }
    if (res.status === 429 || res.status >= 500) { if (tries < 4) { await sleep(5000 * (tries + 1)); OVER.inflight--; return overSql(sql, tries + 1); } throw new Error("OVER החזיר " + res.status); }
    const j = await res.json();
    if (!res.ok) throw new Error(typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail || j));
    return j;
  } catch (e) { if (e.name === "AbortError") throw new Error("השאילתה ל‑OVER לא הסתיימה בזמן"); throw e; }
  finally { OVER.inflight--; }
}
async function overJsonAgg(sql) { const j = await overSql(sql); const v = j.rows && j.rows[0] && j.rows[0].d; if (v == null) return []; return typeof v === "string" ? JSON.parse(v) : v; }
async function overStats() {
  const r = await fetch(OVER.base + "/api/deals/stats"); const s = await r.json();
  const t = String(s.table || "").replace(/^public\./, ""); if (/^[a-z0-9_]+$/.test(t)) OVER.table = t;
  OVER.stats = s; return s;
}

/* =====================================================================
   2. CACHE (IndexedDB key/value; falls back to memory)
   ===================================================================== */
const KV = {
  db: null, mem: new Map(),
  open() { return new Promise((res) => { if (this.db || !("indexedDB" in window)) return res(this.db); const rq = indexedDB.open("nimkar", 1); rq.onupgradeneeded = () => rq.result.createObjectStore("kv"); rq.onsuccess = () => { this.db = rq.result; res(this.db); }; rq.onerror = () => res(null); }); },
  async get(k) { const db = await this.open(); if (!db) return this.mem.get(k); return new Promise((res) => { const rq = db.transaction("kv").objectStore("kv").get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(undefined); }); },
  async set(k, v) { const db = await this.open(); if (!db) { this.mem.set(k, v); return; } return new Promise((res) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); },
  async del(k) { const db = await this.open(); if (!db) { this.mem.delete(k); return; } return new Promise((res) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); }
};

/* =====================================================================
   3. LOADERS: national aggregates, city bundle, daily delta
   ===================================================================== */
const Y_MIN = 1998;
const CUR_YEAR = new Date().getFullYear();
const dayToIso = (days) => new Date(days * 86400000).toISOString().slice(0, 10);
const todayDays = () => Math.floor(Date.now() / 86400000);
function yearWindows(totalDeals) {
  const n = totalDeals > 200000 ? 8 : totalDeals > 90000 ? 6 : totalDeals > 30000 ? 4 : totalDeals > 8000 ? 2 : 1;
  const span = CUR_YEAR - Y_MIN + 1, out = [];
  // later years hold more deals: weight the windows toward the present
  const edges = []; for (let i = 0; i <= n; i++) edges.push(Math.round(Y_MIN + span * Math.pow(i / n, 0.7)));
  for (let i = 0; i < n; i++) { const a = edges[i], b = i === n - 1 ? CUR_YEAR : edges[i + 1] - 1; if (b >= a) out.push([a, b]); }
  return out;
}
const DEAL_SELECT = `json_build_array((substr(deal_date,7,4)||substr(deal_date,4,2)||substr(deal_date,1,2))::int, ${NUM("deal_amount")}, ${NUM("asset_area")}, ${NUM("room_num")}, ${NUM("year_built")}, ${NUM("portion")}, ${NAT_CASE}, gush, chelka, sub_chelka, substr(row_hash::text,1,12), extract(epoch from first_seen)::bigint)`;

async function loadNational(progress) {
  const key = "national:v3"; const cached = await KV.get(key);
  if (cached && Date.now() - cached.at < 24 * 3600000) return cached;
  progress("טוען סדרה ארצית…");
  const years = await overJsonAgg(`SELECT json_agg(json_build_array(y, c, m)) d FROM (SELECT substr(deal_date,7,4) y, count(*) c, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY deal_amount::numeric/asset_area::numeric)) m FROM ${OVER.table} WHERE deal_nature IN (${APT_IN}) AND ${SANE} GROUP BY 1 ORDER BY 1) s`);
  progress("משווה יישובים…");
  const a1 = CUR_YEAR - 2, b1 = CUR_YEAR, a2 = CUR_YEAR - 7, b2 = CUR_YEAR - 5;
  const cmp = await overJsonAgg(`SELECT json_agg(json_build_array(settlement, n1, m1, n2, m2, p1)) d FROM (SELECT settlement, count(*) FILTER (WHERE substr(deal_date,7,4) BETWEEN '${a1}' AND '${b1}') n1, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY deal_amount::numeric/asset_area::numeric) FILTER (WHERE substr(deal_date,7,4) BETWEEN '${a1}' AND '${b1}')) m1, count(*) FILTER (WHERE substr(deal_date,7,4) BETWEEN '${a2}' AND '${b2}') n2, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY deal_amount::numeric/asset_area::numeric) FILTER (WHERE substr(deal_date,7,4) BETWEEN '${a2}' AND '${b2}')) m2, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY deal_amount::numeric) FILTER (WHERE substr(deal_date,7,4) BETWEEN '${a1}' AND '${b1}')) p1 FROM ${OVER.table} WHERE deal_nature IN (${APT_IN}) AND ${SANE} AND substr(deal_date,7,4) >= '${a2}' GROUP BY 1 HAVING count(*) FILTER (WHERE substr(deal_date,7,4) BETWEEN '${a1}' AND '${b1}') >= 20) t`);
  progress("מחשב מגמות ליישובים…");
  const qsince = CUR_YEAR - 3;
  const qs = await overJsonAgg(`SELECT json_agg(json_build_array(s, qk, c, m)) d FROM (SELECT settlement s, substr(deal_date,7,4)||'-Q'||((substr(deal_date,4,2)::int-1)/3+1) qk, count(*) c, round(percentile_cont(0.5) WITHIN GROUP (ORDER BY deal_amount::numeric/asset_area::numeric)) m FROM ${OVER.table} WHERE deal_nature IN (${APT_IN}) AND ${SANE} AND substr(deal_date,7,4) >= '${qsince}' GROUP BY 1,2 HAVING count(*) >= 5) t`);

/* =====================================================================
   4i. TAX CALCULATORS: purchase tax (מס רכישה) and capital-gains tax (מס שבח), estimates
   ===================================================================== */
const TAX = {
  base: { year: 2025, single: [[1978745, 0], [2347040, 0.035], [6055070, 0.05], [20183565, 0.08], [Infinity, 0.10]], other: [[6055070, 0.08], [Infinity, 0.10]], shevachCeiling: 5008000 },
  // brackets are indexed every 16 January by the CPI; we scale the 2025 brackets by the CPI change since Jan 2025 as an estimate
  factor() { const jan25 = CPI.map.get(202501) || CPI.rows[0][2]; const y = +MAX_DATE.slice(0, 4); const janNow = CPI.map.get(y * 100 + 1) || CPI.latest; return Math.max(1, janNow / jan25); },
  purchase(price, kind) { const f = this.factor(); const br = (kind === "other" ? this.base.other : this.base.single).map(([cap, r]) => [cap === Infinity ? Infinity : Math.round(cap * f), r]); let lo = 0, tax = 0; const parts = []; for (const [cap, r] of br) { const hi = Math.min(price, cap); if (hi > lo) { parts.push({ lo, hi, r, t: (hi - lo) * r }); tax += (hi - lo) * r; } lo = cap; if (price <= cap) break; } return { tax, parts, brackets: br }; },
  shevach(buyDate, buyPrice, sellDate, sellPrice, costs, single) {

/* =====================================================================
   4j. RENTS & YIELD: CBS rent survey benchmarks (city / district / national by rooms) → gross yield on current prices
   ===================================================================== */

  if (c && c.avg && nat.bands[band]) return { rent: Math.round(c.avg * nat.bands[band] / nat.avg), src: "<span>ממוצע</span> <b>" + esc(city) + "</b> <span>× תמהיל ארצי</span>" };

/* =====================================================================
   4k. CITY PROFILE from CBS local-authority layers (via OVER): socio-economic cluster, population, wage, building, transit
   ===================================================================== */
const stationsNear = (lat, lng) => {
  const near = (arr, pick) => { let best = null; arr.forEach((s) => { const o = pick(s); const dm = distM(lat, lng, o.lat, o.lng); if (!best || dm < best.d) best = Object.assign({ d: dm }, o); }); return best; };
  return { rail: near(NB.rail.filter((r) => r[1] === "active"), (r) => ({ name: r[0], lat: r[2], lng: r[3] })), railPlanned: near(NB.rail.filter((r) => r[1] !== "active"), (r) => ({ name: r[0], lat: r[2], lng: r[3] })),
    lrt: near(NB.lrt.filter((r) => r[2] === "active"), (r) => ({ name: r[0], line: r[1], lat: r[4], lng: r[5] })), lrtPlanned: near(NB.lrt.filter((r) => r[2] !== "active"), (r) => ({ name: r[0], line: r[1], lat: r[4], lng: r[5] })) };
};
